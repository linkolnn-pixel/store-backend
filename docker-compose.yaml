services:
  store-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - .:/app
      - /app/__pycache__
    command: sh -c "echo 'Запуск миграций Alembic...'; alembic upgrade head; echo 'Миграции применены. Запуск сервера...'; uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WAREHOUSE_URL=${WAREHOUSE_URL}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
    volumes:
      - .:/app
      - /app/__pycache__
    command: python worker.py
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: